version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - refound_data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/refound.db
      - FAISS_INDEX_PATH=./data/faiss_index
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  refound_data: